name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build browser configuration
        run: npm run build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
          GROUP_ID: 00000000-0000-4000-8000-000000000000
          GEOAPIFY_API_KEY: ""

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check i18n.js
          node --check members.js
          node --check profile-menu.js
          node --check ratings-overview.js
          node --check pwa.js
          node --check service-worker.js
          node --check build-config.js
          node --check serve.js

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7

      - name: Type-check the invite Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/invite-member/index.ts

      - name: Test authentication screen transitions
        run: node --test tests/auth-flow.test.mjs tests/ratings-view.test.mjs tests/rating-form.test.mjs tests/profile-menu.test.mjs

      - name: Test invitation retry and authorization behavior
        run: node --test tests/invite-member.test.mjs

      - name: Test cached navigation and hosting redirects
        run: node --test tests/service-worker.test.mjs

      - name: Ensure generated configuration and local secrets are not tracked
        run: |
          if git ls-files --error-unmatch runtime-config.js >/dev/null 2>&1; then
            echo "runtime-config.js must not be committed."
            exit 1
          fi
          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)"
          if [ -n "$tracked_env_files" ]; then
            echo "Local environment files must not be committed."
            exit 1
          fi
          if ! git check-ignore -q runtime-config.js; then
            echo "runtime-config.js must be ignored by Git."
            exit 1
          fi

  rls:
    name: rls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Start disposable local Supabase services
        # Keep the CLI's local anon/service-role keys out of Actions logs.
        run: |
          if ! npx supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo "Supabase local startup failed. CLI output is suppressed to keep generated local credentials out of logs."
            exit 1
          fi
          echo "Disposable Supabase services started."
        env:
          SUPABASE_TELEMETRY_DISABLED: "true"

      - name: Apply migrations to the disposable database
        run: npx supabase db reset
        env:
          SUPABASE_TELEMETRY_DISABLED: "true"

      - name: Run database and RLS tests
        run: npm run test:rls
        env:
          SUPABASE_TELEMETRY_DISABLED: "true"
